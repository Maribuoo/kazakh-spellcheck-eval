name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with development tools
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests with coverage
        run: pytest --cov=kkspell --cov-report=term-missing --cov-fail-under=90
      - name: Smoke test of the command line tool
        run: python -m kkspell evaluate data/sample_corpus_kk.txt --n-eval 60 --bootstrap 50

  # --- Added for Assignment 5 (DevOps and CI/CD) ---
  # Only runs once every matrix entry in `test` has passed, so a Docker
  # image is never built from a commit that failed lint or tests.
  docker:
    needs: test
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: kkspell:ci
      - name: Smoke-test the built image
        run: docker run --rm kkspell:ci evaluate data/sample_corpus_kk.txt --n-eval 60 --bootstrap 50
      - name: Log in to Docker Hub
        if: ${{ github.ref == 'refs/heads/main' && env.DOCKERHUB_TOKEN != '' }}
        run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      - name: Push image to Docker Hub
        if: ${{ github.ref == 'refs/heads/main' && env.DOCKERHUB_TOKEN != '' }}
        run: |
          docker tag kkspell:ci $DOCKERHUB_USERNAME/kkspell:latest
          docker push $DOCKERHUB_USERNAME/kkspell:latest
